default: &default
  adapter: mysql2
  encoding: utf8mb4
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  database: <%= ENV['DB_NAME'] || 'adoteumfilhopovo_development' %>
  username: <%= ENV['DB_USER'] || 'root' %>
  password: <%= ENV['DB_PASSWORD'] %>
  host: <%= ENV['DB_HOST'] || 'localhost' %>
  port: <%= ENV['DB_PORT'] || 3306 %>
  socket: <%= ENV['DB_SOCKET'] if ENV['DB_SOCKET'].present? %>

development:
  <<: *default

test:
  <<: *default
  database: <%= ENV['TEST_DB_NAME'] || 'adoteumfilhopovo_test' %>

production:
  <<: *default
  database: <%= ENV['DB_NAME'] || 'adoteumfilhopovo_production' %>