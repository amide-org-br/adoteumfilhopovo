commit:
  sha: "pending"
  branch: "develop"
  message: |
    feat(mailer): switch SMTP from SendGrid to Brevo [migration:20260513000200_migrate_email_delivery_from_sendgrid_to_brevo]

    SendGrid's free tier rejected the prior migration's SMTP auth with
    "451 Maximum credits exceeded" in production. This migration swaps
    the provider to Brevo SMTP (smtp-relay.brevo.com:587, STARTTLS).

    config/environments/production.rb now reads four keys from
    credentials.dig(:brevo, ...): smtp_server, port, login, smtp_key.
    The human owns the credentials shape; storing non-secret host/port
    alongside the secret keeps all Brevo config in one place and
    simplifies future rotations.

    Renamed test/mailers/sendgrid_credentials_test.rb to
    brevo_credentials_test.rb (git mv preserves history). Tests are
    data-driven over the required key list and add a stricter Integer
    type check on :port to catch the most likely credentials:edit
    footgun (typing "587" with quotes).

    docs/EMAIL_DELIVERY.md fully rewritten for Brevo; the
    "Maximum credits exceeded" callout is kept as a generic SMTP-quota
    troubleshooting hint.

    Live SMTP smoke deferred to a follow-up post-deploy (same pattern as
    20260513000100). To verify after deploy:
      mise exec -- bin/kamal deploy
      mise exec -- bin/kamal app exec --reuse -- \\
        bin/rails runner "puts SmokeMailer.ping.deliver_now.message_id"

